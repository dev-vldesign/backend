apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
    - host: api.vldesign.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vl-design-backend-service
                port:
                  number: 8080
  tls:
    - hosts:
        - api.vldesign.site
      secretName: api-vldesign-tls
